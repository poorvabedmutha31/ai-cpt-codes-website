<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Helvetica, Arial, sans-serif; overflow-x: hidden; }
.container { display: flex; flex-direction: column; height: 100%; }
.controls { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #f8f9fa; border-bottom: 1px solid #eee; flex-wrap: wrap; }
.controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.controls button.active { background: #0066cc; color: white; }
.controls button:not(.active) { background: #e0e0e0; color: #333; }
.controls label { font-size: 12px; color: #666; }
.controls select, .controls input { font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
.main { display: flex; flex: 1; min-height: 0; }
#map { flex: 1; min-width: 0; }
.sidebar { width: 260px; display: flex; flex-direction: column; border-left: 1px solid #eee; overflow: hidden; }
.sidebar.hidden { display: none; }
#detail-panel { flex: 1; padding: 12px; overflow-y: auto; }
#detail-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
#detail-chart { width: 100%; height: 180px; }
#ranking-panel { padding: 12px; border-top: 1px solid #eee; }
#ranking-panel h4 { margin: 0 0 8px 0; font-size: 13px; color: #666; }
.rank-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px solid #f0f0f0; }
.rank-item .name { color: #333; }
.rank-item .val { font-weight: 600; color: #0066cc; }
@media (max-width: 768px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 250px; border-left: none; border-top: 1px solid #eee; }
    #map { height: 350px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="controls">
        <button id="btn-monthly" class="active" onclick="setMode('monthly')">Monthly</button>
        <button id="btn-cumulative" onclick="setMode('cumulative')">Cumulative</button>
        <label>Speed:</label>
        <select id="speed-select" onchange="setSpeed(this.value)">
            <option value="800">Slow</option>
            <option value="400" selected>Normal</option>
            <option value="200">Fast</option>
        </select>
        <button id="play-btn" onclick="togglePlay()">▶ Play</button>
        <span id="month-display" style="font-size:13px;font-weight:600;color:#333;margin-left:auto;"></span>
    </div>
    <div class="main">
        <div id="map"></div>
        <div class="sidebar" id="sidebar">
            <div id="detail-panel">
                <h3 id="detail-title">Click a state for details</h3>
                <div id="detail-chart"></div>
            </div>
            <div id="ranking-panel">
                <h4>Top 5 States</h4>
                <div id="ranking-list"></div>
            </div>
        </div>
    </div>
</div>

var currentMonth = 0;
var mode = 'monthly';
var playing = false;
var interval = null;
var speed = 400;

function getMapData(monthIdx) {
    var d = DATA.monthlyData[monthIdx];
    if (mode === 'cumulative') {
        var vals = d.states.map(function(s) { return DATA.cumulativeSeries[s][monthIdx]; });
        return { abbrevs: d.abbrevs, values: vals, states: d.states };
    }
    return d;
}

function getZRange() {
    if (mode === 'cumulative') return [0, DATA.cumulMax];
    return [DATA.globalMin, DATA.globalMax];
}

function initMap() {
    var d = getMapData(0);
    var range = getZRange();
    var trace = {
        type: 'choropleth',
        locations: d.abbrevs,
        z: d.values,
        locationmode: 'USA-states',
        colorscale: DATA.zissouColors,
        zmin: range[0], zmax: range[1],
        text: d.states,
        customdata: d.values.map(function(v) { return Math.round(v * 100) / 100; }),
        hovertemplate: '<b>%{text}</b><br>Per 100,000: %{customdata}<extra></extra>',
        colorbar: { title: 'Per 100,000', len: 0.8 },
        marker: { line: { color: 'white', width: 0.5 } }
    };
    var layout = {
        geo: { scope: 'usa', projection: { type: 'albers usa' }, showland: true, landcolor: 'rgb(243,243,243)', showlakes: true, lakecolor: 'rgb(255,255,255)', showframe: false },
        margin: { l: 0, r: 0, t: 10, b: 10 },
        autosize: true
    };
    Plotly.newPlot('map', [trace], layout, { responsive: true }).then(function(gd) {
        gd.on('plotly_click', function(ev) {
            if (ev.points && ev.points[0]) {
                showDetail(ev.points[0].text);
            }
        });
    });
    updateMonthDisplay();
    updateRanking();
}

function updateMap() {
    var d = getMapData(currentMonth);
    var range = getZRange();
    Plotly.restyle('map', {
        z: [d.values],
        locations: [d.abbrevs],
        text: [d.states],
        customdata: [d.values.map(function(v) { return Math.round(v * 100) / 100; })],
        zmin: range[0], zmax: range[1]
    });
    updateMonthDisplay();
    updateRanking();
}

function updateMonthDisplay() {
    document.getElementById('month-display').textContent = DATA.monthLabels[currentMonth];
}

function updateRanking() {
    var d = getMapData(currentMonth);
    var pairs = d.states.map(function(s, i) { return [s, d.values[i]]; });
    pairs.sort(function(a, b) { return b[1] - a[1]; });
    var html = '';
    for (var i = 0; i < 5 && i < pairs.length; i++) {
        html += '<div class="rank-item"><span class="name">' + (i+1) + '. ' + pairs[i][0] + '</span><span class="val">' + pairs[i][1].toFixed(1) + '</span></div>';
    }
    document.getElementById('ranking-list').innerHTML = html;
}

function showDetail(stateName) {
    document.getElementById('detail-title').textContent = stateName;
    var vals = mode === 'cumulative' ? DATA.cumulativeSeries[stateName] : DATA.timeSeries[stateName];
    var trace = {
        x: DATA.dates,
        y: vals,
        type: 'scatter',
        mode: 'lines',
        line: { color: '#0066cc', width: 2 },
        fill: 'tozeroy',
        fillcolor: 'rgba(0,102,204,0.1)'
    };
    var layout = {
        margin: { l: 40, r: 10, t: 10, b: 30 },
        xaxis: { tickformat: '%b %Y', nticks: 6, tickfont: { size: 10 } },
        yaxis: { title: { text: 'Per 100k', font: { size: 10 } }, tickfont: { size: 10 } },
        autosize: true,
        height: 180
    };
    Plotly.newPlot('detail-chart', [trace], layout, { responsive: true, displayModeBar: false });
}

function setMode(m) {
    mode = m;
    document.getElementById('btn-monthly').className = m === 'monthly' ? 'active' : '';
    document.getElementById('btn-cumulative').className = m === 'cumulative' ? 'active' : '';
    updateMap();
    var title = document.getElementById('detail-title').textContent;
    if (title && title !== 'Click a state for details') showDetail(title);
}

function setSpeed(v) { speed = parseInt(v); if (playing) { clearInterval(interval); startPlay(); } }

function togglePlay() {
    if (playing) { stopPlay(); } else { startPlay(); }
}

function startPlay() {
    playing = true;
    document.getElementById('play-btn').textContent = '⏸ Pause';
    interval = setInterval(function() {
        currentMonth++;
        if (currentMonth >= DATA.monthLabels.length) currentMonth = 0;
        updateMap();
    }, speed);
}

function stopPlay() {
    playing = false;
    document.getElementById('play-btn').textContent = '▶ Play';
    if (interval) { clearInterval(interval); interval = null; }
}

initMap();
window.addEventListener('resize', function() { Plotly.Plots.resize(document.getElementById('map')); });
</script>
</body>
</html>
