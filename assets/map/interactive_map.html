var current = 0, playing = false, timer = null;

// Generate tick marks
(function() {
    var container = document.getElementById('ticks');
    for (var i = 0; i < 63; i++) {
        var t = document.createElement('div');
        t.className = (i % 12 === 0) ? 'tick major' : 'tick';
        container.appendChild(t);
    }
})();

function getResponsiveConfig() {
    var isMobile = window.innerWidth < 600;
    var isTablet = window.innerWidth >= 600 && window.innerWidth < 900;
    var colorbar, titleSize, margin;
    if (isMobile) {
        colorbar = { title: { text: 'Per 100k', font: { size: 8, family: 'Helvetica, Arial, sans-serif' } }, len: 0.5, thickness: 8, tickfont: { size: 7, family: 'Helvetica, Arial, sans-serif' }, x: 1.01 };
        titleSize = 13;
        margin = { l: 0, r: 0, t: 45, b: 0 };
    } else if (isTablet) {
        colorbar = { title: { text: 'Per 100,000\npopulation', font: { size: 9, family: 'Helvetica, Arial, sans-serif' } }, len: 0.6, thickness: 10, tickfont: { size: 8, family: 'Helvetica, Arial, sans-serif' } };
        titleSize = 14;
        margin = { l: 0, r: 0, t: 55, b: 0 };
    } else {
        colorbar = { title: { text: 'Per 100,000\npopulation', font: { size: 10, family: 'Helvetica, Arial, sans-serif' } }, len: 0.75, thickness: 12, tickfont: { size: 9, family: 'Helvetica, Arial, sans-serif' } };
        titleSize = 16;
        margin = { l: 0, r: 0, t: 60, b: 0 };
    }
    return { colorbar: colorbar, titleSize: titleSize, margin: margin };
}

function initMap() {
    var d = DATA.monthlyData[0];
    var cfg = getResponsiveConfig();
    Plotly.newPlot('map', [{
        type: 'choropleth', locations: d.abbrevs, z: d.values,
        locationmode: 'USA-states', colorscale: DATA.zissouColors,
        zmin: DATA.globalMin, zmax: DATA.globalMax,
        text: d.states, customdata: d.values,
        hovertemplate: '<b>%{text}</b><br>%{customdata} encounters per 100,000 population<extra></extra>',
        colorbar: cfg.colorbar,
        marker: { line: { color: 'white', width: 0.5 } }
    }], {
        title: { text: 'Encounters per capita<br><span style="font-size:15px;font-weight:bold;color:#333">' + DATA.monthLabels[0] + '</span>', font: { size: cfg.titleSize, family: 'Helvetica, Arial, sans-serif' }, x: 0.5, xanchor: 'center' },
        geo: { scope: 'usa', projection: { type: 'albers usa' }, showland: true, landcolor: 'rgb(248,248,248)', showlakes: true, lakecolor: 'rgb(255,255,255)', showframe: false, lonaxis: { showgrid: true, gridwidth: 0.5, gridcolor: 'rgba(0,0,0,0.1)', dtick: 10 }, lataxis: { showgrid: true, gridwidth: 0.5, gridcolor: 'rgba(0,0,0,0.1)', dtick: 5 } },
        margin: cfg.margin, autosize: true,
        font: { family: 'Helvetica, Arial, sans-serif' }
    }, { responsive: true });
}

function update(idx) {
    current = idx;
    var d = DATA.monthlyData[idx];
    Plotly.restyle('map', { z: [d.values], locations: [d.abbrevs], text: [d.states], customdata: [d.values] });
    Plotly.relayout('map', { 'title.text': 'Encounters per capita<br><span style="font-size:15px;font-weight:bold;color:#333">' + DATA.monthLabels[idx] + '</span>' });
    document.getElementById('slider').value = idx;
}

function goTo(idx) { update(idx); }

function doPlay() {
    if (playing) return;
    playing = true;
    document.getElementById('playBtn').classList.add('active');
    document.getElementById('pauseBtn').classList.remove('active');
    timer = setInterval(function() {
        current++;
        if (current >= DATA.monthLabels.length) current = 0;
        update(current);
    }, 350);
}

function doPause() {
    playing = false;
    document.getElementById('pauseBtn').classList.add('active');
    document.getElementById('playBtn').classList.remove('active');
    if (timer) { clearInterval(timer); timer = null; }
}

initMap();
window.addEventListener('resize', function() {
    Plotly.Plots.resize(document.getElementById('map'));
    var cfg = getResponsiveConfig();
    Plotly.restyle('map', { 'colorbar.len': cfg.colorbar.len, 'colorbar.thickness': cfg.colorbar.thickness });
    Plotly.relayout('map', { margin: cfg.margin });
});
</script>
