var currentMonth = 0;
var playing = false;
var interval = null;

function initMap() {
    var d = DATA.monthlyData[0];
    var trace = {
        type: 'choropleth', locations: d.abbrevs, z: d.values,
        locationmode: 'USA-states', colorscale: DATA.zissouColors,
        zmin: DATA.globalMin, zmax: DATA.globalMax,
        text: d.states,
        customdata: d.values.map(function(v) { return Math.round(v * 100) / 100; }),
        hovertemplate: '<b>%{text}</b><br>Per 100,000: %{customdata}<extra></extra>',
        colorbar: { title: 'Per 100,000', len: 0.75, thickness: 12, tickfont: { size: 10 }, titlefont: { size: 11 } },
        marker: { line: { color: 'white', width: 0.5 } }
    };
    var layout = {
        title: { text: 'Encounters per capita<br><span style="font-size:13px;font-weight:normal;color:#666">' + DATA.monthLabels[0] + '</span>', font: { size: 16, family: 'Helvetica' }, x: 0.01, xanchor: 'left', y: 0.97 },
        geo: {
            scope: 'usa', projection: { type: 'albers usa' },
            showland: true, landcolor: 'rgb(250,250,250)',
            showlakes: true, lakecolor: 'rgb(255,255,255)',
            showframe: false,
            lonaxis: { showgrid: true, gridwidth: 0.5, gridcolor: 'rgba(0,0,0,0.06)', dtick: 10 },
            lataxis: { showgrid: true, gridwidth: 0.5, gridcolor: 'rgba(0,0,0,0.06)', dtick: 5 },
            bgcolor: 'rgba(0,0,0,0)'
        },
        margin: { l: 0, r: 0, t: 45, b: 0 },
        autosize: true,
        paper_bgcolor: 'white'
    };
    Plotly.newPlot('map', [trace], layout, { responsive: true });
}

function updateMap(monthIdx) {
    currentMonth = monthIdx;
    var d = DATA.monthlyData[monthIdx];
    Plotly.restyle('map', {
        z: [d.values], locations: [d.abbrevs], text: [d.states],
        customdata: [d.values.map(function(v) { return Math.round(v * 100) / 100; })]
    });
    Plotly.relayout('map', {
        'title.text': 'Encounters per capita<br><span style="font-size:13px;font-weight:normal;color:#666">' + DATA.monthLabels[monthIdx] + '</span>'
    });
    document.getElementById('slider').value = monthIdx;
}

function goToMonth(idx) {
    updateMap(idx);
}

function togglePlay() {
    if (playing) stopPlay(); else startPlay();
}

function startPlay() {
    playing = true;
    document.getElementById('play-btn').innerHTML = '&#9646;&#9646;';
    interval = setInterval(function() {
        currentMonth++;
        if (currentMonth >= DATA.monthLabels.length) currentMonth = 0;
        updateMap(currentMonth);
    }, 350);
}

function stopPlay() {
    playing = false;
    document.getElementById('play-btn').innerHTML = '&#9654;';
    if (interval) { clearInterval(interval); interval = null; }
}

initMap();
window.addEventListener('resize', function() { Plotly.Plots.resize(document.getElementById('map')); });
</script>
