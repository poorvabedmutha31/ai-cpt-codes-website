<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc"/>
      <stop offset="100%" style="stop-color:#00a3e0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#grad)"/>
  <!-- Medical cross (white) -->
  <rect x="206" y="120" width="100" height="272" rx="16" fill="white" opacity="0.95"/>
  <rect x="120" y="206" width="272" height="100" rx="16" fill="white" opacity="0.95"/>
  <!-- Network nodes representing AI/data -->
  <circle cx="156" cy="156" r="18" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <circle cx="356" cy="156" r="18" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <circle cx="156" cy="356" r="18" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <circle cx="356" cy="356" r="18" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <!-- Connection lines (neural network feel) -->
  <line x1="170" y1="170" x2="206" y2="206" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="342" y1="170" x2="306" y2="206" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="170" y1="342" x2="206" y2="306" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="342" y1="342" x2="306" y2="306" stroke="white" stroke-width="3" opacity="0.4"/>
  <!-- Small dots at intersections -->
  <circle cx="156" cy="156" r="8" fill="white" opacity="0.9"/>
  <circle cx="356" cy="156" r="8" fill="white" opacity="0.9"/>
  <circle cx="156" cy="356" r="8" fill="white" opacity="0.9"/>
  <circle cx="356" cy="356" r="8" fill="white" opacity="0.9"/>
</svg>
